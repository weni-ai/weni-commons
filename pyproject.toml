[tool.isort]
profile = "black"

[tool.poetry]
name = "weni-commons"
version = "1.6.0a0"
description = "Weni's common utilities for Python backends"
authors = ["Kallil Souza dos Santos <kallilsouza@hotmail.com>"]
readme = "README.md"
packages = [{ include = "weni_commons" }]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
django = ">=3.2.22,<6.0"
djangorestframework = ">=3.12.0,<4.0"
django-redis = ">=4.0.0,<=6.0"
celery = ">=5.0.0,<6.0"
mozilla-django-oidc = ">=2.0.0,<5.0"
pyjwt = ">=2.8.0,<3.0"
weni-feature-flags = "^2.2.0"
# Allow 0.2.x (e.g. flows staging uses 0.2.0a10); ^0.1.2 rejected those.
weni-eda = ">=0.1.2a0"
requests = ">=2.25.0"
boto3 = ">=1.18.0,<2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-django = "^4.9.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
